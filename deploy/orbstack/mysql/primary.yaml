apiVersion: v1
kind: Service
metadata:
  name: mysql-primary
  namespace: mysql
  labels:
    app: mysql
    component: primary
    app.kubernetes.io/part-of: proxysql-agent-smoke
spec:
  selector:
    app: mysql
    component: primary
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-primary
  namespace: mysql
  labels:
    app: mysql
    component: primary
    app.kubernetes.io/part-of: proxysql-agent-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
      component: primary
  template:
    metadata:
      labels:
        app: mysql
        component: primary
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.36
          args:
            - --server-id=1
            - --log-bin=mysql-bin
            - --binlog-format=row
            - --gtid-mode=ON
            - --enforce-gtid-consistency=ON
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: test
          ports:
            - containerPort: 3306
              name: mysql
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - 127.0.0.1
                - -uroot
                - -proot
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - 127.0.0.1
                - -uroot
                - -proot
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: init
          configMap:
            name: mysql-init
        - name: data
          emptyDir: {}

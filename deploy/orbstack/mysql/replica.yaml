apiVersion: v1
kind: Service
metadata:
  name: mysql-replica
  namespace: mysql
  labels:
    app: mysql
    component: replica
    app.kubernetes.io/part-of: proxysql-agent-smoke
spec:
  selector:
    app: mysql
    component: replica
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-replica
  namespace: mysql
  labels:
    app: mysql
    component: replica
    app.kubernetes.io/part-of: proxysql-agent-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
      component: replica
  template:
    metadata:
      labels:
        app: mysql
        component: replica
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.36
          # Intentionally not read-only at boot: --super-read-only breaks
          # docker-entrypoint init scripts (CREATE USER). ProxySQL HG2 only
          # needs a reachable second backend for the smoke stack.
          args:
            - --server-id=2
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: test
          ports:
            - containerPort: 3306
              name: mysql
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - 127.0.0.1
                - -uroot
                - -proot
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - 127.0.0.1
                - -uroot
                - -proot
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: init
          configMap:
            name: mysql-init
        - name: data
          emptyDir: {}
